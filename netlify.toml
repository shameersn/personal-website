# Netlify build settings for shameer.sn (Astro, static)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cache static assets for a long time (Astro adds content hashes to these files)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Add redirects from old URLs here if the old site had other pages, for example:
# [[redirects]]
#   from = "/old-page"
#   to = "/about"
#   status = 301
